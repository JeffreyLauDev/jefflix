name: Feature request
description: An idea to make Jefflix better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem first, then your idea for solving it.
    validations: { required: true }
  - type: dropdown
    id: platform
    attributes:
      label: Which screens does it matter on?
      multiple: true
      options: [Desktop, iPhone / iPad, LG TV, Web, All]
